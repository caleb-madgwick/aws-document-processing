<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="title desc">
  <title id="title">Architecture</title>
  <desc id="desc">Fictional invoice PDFs are processed only after STS confirms the expected AWS account ID. Each PDF is uploaded to Amazon S3, read by Amazon Textract AnalyzeExpense, and interpreted by Claude on Amazon Bedrock into typed JSON. Locally, Pydantic checks types, every required field must be present, and subtotal plus tax must equal the total within 2 cents. Any problem marks the invoice needs_review. Results are saved as JSON, alongside the extracted plain text. A Textract-only path is validated the same way for comparison.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606A"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1F2328; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .label { font-size: 13px; font-weight: 600; letter-spacing: 1.3px; fill: #59636E; }
      .label-accent { fill: #2F7D64; }
      .title { font-size: 17px; font-weight: 600; }
      .service { font-size: 13px; font-weight: 600; }
      .step { font-size: 14.5px; font-weight: 600; fill: #2F7D64; }
      .body { font-size: 13.5px; }
      .muted { font-size: 13.5px; fill: #59636E; }
      .note { font-size: 12.5px; fill: #59636E; }
      .chip-text { font-size: 12.5px; }
      .arrow { fill: none; stroke: #57606A; stroke-width: 1.6; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 5 4; }
      .panel { fill: #F6F8FA; stroke: #D0D7DE; }
      .panel-accent { fill: #EEF7F2; stroke: #B9DFCB; }
      .card { fill: #FFFFFF; stroke: #D0D7DE; }
      .card-accent { fill: #FFFFFF; stroke: #2F7D64; stroke-width: 1.5; }
      .chip { fill: #E3F3EC; stroke: #8CCBB2; }
      .divider { stroke: #D0D7DE; }
    </style>
  </defs>

  <!-- Solid background so the diagram reads in GitHub light and dark themes -->
  <rect x="0.5" y="0.5" width="1199" height="469" rx="16" fill="#FFFFFF" stroke="#D0D7DE"/>

  <!-- Panel 1: local input -->
  <rect class="panel" x="32" y="32" width="250" height="406" rx="12"/>
  <text class="label" x="56" y="62">INPUT</text>

  <rect class="card" x="56" y="84" width="202" height="150" rx="10"/>
  <text class="title" x="76" y="116">Invoice PDFs</text>
  <text class="muted" x="76" y="140">fictional, mixed layouts</text>
  <rect class="chip" x="76" y="160" width="162" height="34" rx="8"/>
  <text class="chip-text mono" x="90" y="182">invoices/*.pdf</text>

  <rect class="card-accent" x="56" y="270" width="202" height="144" rx="10"/>
  <text class="title" x="76" y="302">Account check</text>
  <text class="body" x="76" y="326">STS must return the</text>
  <text class="body" x="76" y="346">expected account ID</text>
  <text class="note" x="76" y="390">otherwise: stop</text>

  <!-- Panel 2: AWS -->
  <rect class="panel-accent" x="306" y="32" width="400" height="406" rx="12"/>
  <text class="label label-accent" x="330" y="62">AWS</text>

  <rect class="card" x="330" y="84" width="352" height="96" rx="10"/>
  <text class="title" x="350" y="116">Amazon S3</text>
  <text class="service mono" x="350" y="140">s3://&lt;bucket&gt;/invoices/</text>
  <text class="muted" x="350" y="162">stores the uploaded PDF</text>

  <rect class="card" x="330" y="200" width="352" height="96" rx="10"/>
  <text class="title" x="350" y="232">Amazon Textract</text>
  <text class="service mono" x="350" y="256">AnalyzeExpense</text>
  <text class="muted" x="350" y="278">OCR text + invoice fields</text>

  <rect class="card" x="330" y="316" width="352" height="96" rx="10"/>
  <text class="title" x="350" y="348">Claude on Amazon Bedrock</text>
  <text class="service mono" x="350" y="372">anthropic.claude-*</text>
  <text class="muted" x="350" y="394">interprets the text → typed JSON</text>

  <!-- Panel 3: local validation and output -->
  <rect class="panel" x="730" y="32" width="438" height="406" rx="12"/>
  <text class="label" x="754" y="62">VALIDATE AND SAVE</text>

  <rect class="card-accent" x="754" y="84" width="200" height="330" rx="10"/>
  <text class="title" x="774" y="116">Validate</text>

  <text class="step" x="774" y="152">1 · Types</text>
  <text class="body" x="774" y="174">Pydantic: real dates,</text>
  <text class="body" x="774" y="194">Decimal amounts</text>
  <line class="divider" x1="774" y1="212" x2="934" y2="212"/>

  <text class="step" x="774" y="240">2 · Required</text>
  <text class="body" x="774" y="262">all 7 fields present</text>
  <line class="divider" x1="774" y1="280" x2="934" y2="280"/>

  <text class="step" x="774" y="308">3 · Arithmetic</text>
  <text class="body" x="774" y="330">subtotal + tax = total</text>
  <text class="body" x="774" y="350">within 2 cents</text>

  <text class="note" x="774" y="384">any problem →</text>
  <text class="note mono" x="774" y="402">needs_review</text>

  <rect class="card-accent" x="978" y="84" width="166" height="330" rx="10"/>
  <text class="title" x="998" y="116">Output</text>

  <text class="step" x="998" y="156">Result</text>
  <text class="mono" x="998" y="178" style="font-size:11.5px">output/*.json</text>
  <text class="body" x="998" y="200">fields, status</text>
  <text class="body" x="998" y="220">and reasons</text>

  <text class="step" x="998" y="262">Plain text</text>
  <text class="mono" x="998" y="284" style="font-size:11.5px">output/*.txt</text>
  <text class="body" x="998" y="306">extracted text</text>

  <text class="note" x="998" y="384">dashed line:</text>
  <text class="note" x="998" y="402">Textract-only baseline</text>

  <!-- Arrows last, so they draw on top of the panels -->
  <path class="arrow" d="M157 234 V266"/>
  <path class="arrow" d="M258 342 H294 V132 H328"/>
  <path class="arrow" d="M506 180 V196"/>
  <path class="arrow" d="M506 296 V312"/>
  <path class="arrow dashed" d="M682 248 H752"/>
  <path class="arrow" d="M682 364 H718 V300 H752"/>
  <path class="arrow" d="M954 249 H976"/>
</svg>
